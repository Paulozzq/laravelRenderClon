version: '3.8'

services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_DB: laravel_db
      POSTGRES_USER: laravel_user
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'  # Puerto estándar de PostgreSQL
    volumes:
      - db_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    depends_on:
      - db  # Adminer espera a que PostgreSQL se inicie
    ports:
      - '8080:8080'  # Acceso a Adminer en http://localhost:8080
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  db_data:
